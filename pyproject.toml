[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open3d-reconstruct"
version = "0.5.0"
description = "Locally isolated Azure Kinect and RealSense Open3D reconstruction workflow with a local web console"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The Linux Open3D wheel declares this dependency, but its macOS wheel does
    # not. Listing it explicitly avoids cross-wheel metadata ambiguity in lock tools.
    "ipywidgets==8.1.9",
    # WSL2 uses the bundled static executable for calibrated MKV extraction;
    # ordinary Linux may continue to use system ffmpeg/ffprobe when installed.
    "imageio-ffmpeg==0.6.0; sys_platform == 'linux'",
    "numpy==1.26.4",
    "open3d==0.19.0",
    "opencv-python-headless==4.10.0.84",
    # Used to suspend and resume the complete reconstruction process tree on
    # Windows, where POSIX process-group signals are unavailable.
    "psutil==7.2.2",
    # One tensor implementation serves NVIDIA CUDA on Linux and Metal/MPS on
    # Apple Silicon. Intel macOS and Windows use the Open3D CPU path.
    "torch==2.14.0; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[project.scripts]
open3d-reconstruct = "open3d_reconstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open3d_reconstruct = ["webui/*.html", "webui/*.css", "webui/*.js"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
